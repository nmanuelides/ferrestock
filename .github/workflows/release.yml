# Compila el APK firmado en cada push a main y lo publica como GitHub Release
# `build-<versionCode>`. La app mira la última release al abrirse y ofrece instalarla.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "supabase/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = cantidad de commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decodificar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret RELEASE_KEYSTORE_BASE64; las actualizaciones tienen que firmarse siempre con la misma clave."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          apk=$(ls dist/ferrestock-v*.apk | head -1)
          echo "APK_FILE=$apk" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          label=$(basename "$apk" .apk); echo "APP_LABEL=${label#ferrestock-}" >> "$GITHUB_ENV"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # El tag build-<versionCode> es lo que la app instalada compara para actualizarse.
          gh release create "build-$VERSION_CODE" "$APK_FILE" \
            --target "${{ github.sha }}" \
            --title "Ferrestock $APP_LABEL" \
            --notes "${COMMIT_MSG:-Nueva versión}" \
            --latest
